name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hosted runner only: this repository is public, and a self-hosted runner would execute fork pull requests.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  # Pins the omp behaviour raven's wake-ups rely on. The version below is the one proven; bumping it reruns the proof.
  omp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: install omp
        run: |
          bun add -g @oh-my-pi/pi-coding-agent@19.1.1
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun test test/omp.e2e.test.ts --reporter=junit --reporter-outfile="$RUNNER_TEMP/omp.xml"
        env:
          RAVEN_OMP_E2E: "1"
      # A skipped proof must not read as green.
      - name: prove the omp tests ran
        run: |
          grep -oE '<testcase [^>]*name="[^"]*"' "$RUNNER_TEMP/omp.xml"
          if grep -q '<skipped' "$RUNNER_TEMP/omp.xml"; then
            echo "an omp test skipped"; exit 1
          fi
